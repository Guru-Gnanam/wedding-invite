<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gurunathan G & Mariya Epsiba S | Wedding Invite</title>

  <!-- Privacy Tag -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Open Graph Tags -->
  <meta property="og:title" content="Gurunathan & Mariya are getting married!" />
  <meta property="og:description" content="We warmly seek your presence and blessings. Click to view invitation!" />
  <meta property="og:image" content="https://guru-gnanam.github.io/wedding-invite/front-bg.png" />
  <meta property="og:url" content="https://guru-gnanam.github.io/wedding-invite/" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Lightweight Confetti for Flower Shower -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary-wine: #6e1322;
      --deep-crimson: #630f1c;
      --sacred-gold: #b3833b;
      --soft-gold: #d8b26e;
      --card-cream: #faf5ed;
      --text-dark: #2a1f20;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #110507;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--text-dark);
      overflow-x: hidden;
    }

    body {
      background: radial-gradient(circle at top, #fdf9f4 0%, #ece0d2 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 10px;
      min-height: 100dvh;
    }

    /* --- FULL SCREEN OPENING OVERLAY --- */
    #welcomeOverlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: radial-gradient(circle at center, #260a0f 0%, #0d0204 100%);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      margin: 0;
      transition: opacity 0.85s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.85s;
    }

    #welcomeOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope-poster-card {
      width: 100%;
      max-width: 420px;
      height: 94dvh;
      max-height: 720px;
      background: #fdfaf6 url('front-bg.png') no-repeat center center;
      background-size: cover;
      border-radius: 18px;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(198, 146, 59, 0.45);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Tap Zone aligned directly over the artwork's seal */
    .seal-tap-zone {
      position: absolute;
      top: 50.8%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Subtle pulsing aura ring around the artwork's seal */
    .seal-pulse-ring {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      border: 2px solid rgba(212, 175, 55, 0.85);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.6), inset 0 0 15px rgba(212, 175, 55, 0.4);
      animation: sealRingPulse 2s infinite ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(110, 19, 34, 0.15);
      backdrop-filter: blur(0.5px);
    }

    .seal-open-cue {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 2.5px;
      color: #fff6db;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      margin-top: 36px;
    }

    @keyframes sealRingPulse {
      0%, 100% {
        transform: scale(0.96);
        box-shadow: 0 0 12px rgba(212, 175, 55, 0.4), inset 0 0 8px rgba(212, 175, 55, 0.2);
        border-color: rgba(212, 175, 55, 0.6);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 25px rgba(212, 175, 55, 0.9), inset 0 0 16px rgba(212, 175, 55, 0.5);
        border-color: rgba(255, 235, 170, 1);
      }
    }

    /* --- INVITATION CARD --- */
    .invite-card {
      max-width: 440px;
      width: 100%;
      background: #faf6ef;
      border: 1px solid #e7d8c6;
      border-radius: 24px;
      box-shadow: 0 22px 55px rgba(99, 15, 28, 0.16);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      opacity: 0;
      transform: translateY(40px) scale(0.92);
      transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      margin: auto 0;
    }

    .invite-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .video-frame {
      width: 100%;
      background: #000;
      line-height: 0;
      position: relative;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .content {
      width: 100%;
      padding: 34px 20px 28px;
      text-align: center;
      background: 
        radial-gradient(circle at top right, rgba(179, 131, 59, 0.08), transparent 50%),
        radial-gradient(circle at bottom left, rgba(110, 19, 34, 0.06), transparent 50%),
        #faf6ef;
      position: relative;
    }

    .content::before {
      content: "";
      position: absolute;
      top: -30px;
      right: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1.5px dashed rgba(179, 131, 59, 0.18);
      box-shadow: 0 0 0 10px rgba(179, 131, 59, 0.05), inset 0 0 0 15px rgba(179, 131, 59, 0.05);
      pointer-events: none;
    }

    .content::after {
      content: "";
      position: absolute;
      bottom: -30px;
      left: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1.5px dashed rgba(179, 131, 59, 0.18);
      box-shadow: 0 0 0 10px rgba(179, 131, 59, 0.05), inset 0 0 0 15px rgba(179, 131, 59, 0.05);
      pointer-events: none;
    }

    .intro-script {
      font-size: 1.25rem;
      font-style: italic;
      color: #634b35;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .flourish-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--sacred-gold);
      font-size: 0.85rem;
      margin: 6px auto 14px;
      width: 60%;
    }

    .flourish-divider::before,
    .flourish-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sacred-gold), transparent);
    }

    .couple-section {
      margin-bottom: 24px;
    }

    .couple-name {
      font-family: 'Alex Brush', cursive;
      font-size: 3.4rem;
      color: var(--primary-wine);
      line-height: 1.05;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .knot-caption {
      font-size: 1.15rem;
      font-style: italic;
      color: #6b533b;
      margin: 4px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .knot-caption span {
      color: var(--sacred-gold);
      font-size: 0.85rem;
    }

    .countdown-arch-banner {
      width: 100%;
      background: radial-gradient(circle at center, #781324 0%, #580d19 100%);
      border: 1.5px solid var(--sacred-gold);
      border-radius: 40px;
      padding: 14px 12px 12px;
      box-shadow: 0 8px 24px rgba(99, 15, 28, 0.28), inset 0 1px 3px rgba(255, 255, 255, 0.25);
      margin-bottom: 30px;
      position: relative;
    }

    .countdown-title {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 3.5px;
      color: var(--soft-gold);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 10px;
      text-align: center;
    }

    .countdown-columns {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 14px;
