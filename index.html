    :root {
      --primary-wine: #6e1322;
      --deep-crimson: #630f1c;
      --sacred-gold: #b3833b;
      --soft-gold: #d8b26e;
      --card-cream: #faf5ed;
      --text-dark: #2a1f20;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #110507;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--text-dark);
      overflow-x: hidden;
    }

    body {
      background: radial-gradient(circle at top, #fdf9f4 0%, #ece0d2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 10px;
      min-height: 100vh;
    }

    /* --- FULL SCREEN CINEMATIC OVERLAY --- */
    #welcomeOverlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #260a0f 0%, #0d0204 100%);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 10px;
      transition: opacity 1.1s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
    }

    #welcomeOverlay.unsealed {
      opacity: 0;
      transform: scale(1.06);
      visibility: hidden;
      pointer-events: none;
    }

    .envelope-poster-card {
      width: 100%;
      max-width: 420px;
      height: min(740px, 92vh);
      min-height: 520px;
      background: #fdfaf6 url('front-bg.png') no-repeat center center;
      background-size: cover;
      border-radius: 20px;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(198, 146, 59, 0.45);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: transform 0.8s ease, filter 0.8s ease;
    }

    .envelope-poster-card.opening {
      transform: scale(0.96);
      filter: brightness(1.08);
    }

    /* Tap Zone perfectly targeted over the illustrated wax seal */
    .seal-tap-zone {
      position: absolute;
      top: 51.2%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      z-index: 5;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Sacred Gold Aura Halo pulsing over the graphic seal */
    .seal-aura-halo {
      width: 106px;
      height: 106px;
      border-radius: 50%;
      border: 2px solid rgba(212, 175, 55, 0.85);
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.7), inset 0 0 16px rgba(212, 175, 55, 0.35);
      animation: sealHaloPulse 2.2s infinite ease-in-out;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 12px;
      background: rgba(110, 19, 34, 0.12);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
    }

    .seal-tap-zone:hover .seal-aura-halo {
      transform: scale(1.08);
      box-shadow: 0 0 32px rgba(212, 175, 55, 0.95), inset 0 0 20px rgba(212, 175, 55, 0.5);
    }

    .seal-tap-zone:active .seal-aura-halo {
      transform: scale(0.92);
    }

    .seal-open-text {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 2.5px;
      color: #fff6db;
      font-weight: 700;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      user-select: none;
    }

    @keyframes sealHaloPulse {
      0%, 100% {
        transform: scale(0.97);
        box-shadow: 0 0 14px rgba(212, 175, 55, 0.45);
        border-color: rgba(212, 175, 55, 0.65);
      }
      50% {
        transform: scale(1.06);
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.95), inset 0 0 18px rgba(212, 175, 55, 0.45);
        border-color: rgba(255, 235, 170, 1);
      }
    }

    /* --- INVITATION MAIN CARD --- */
    .invite-card {
      max-width: 440px;
      width: 100%;
      background: #faf6ef;
      border: 1px solid #e7d8c6;
      border-radius: 24px;
      box-shadow: 0 22px 55px rgba(99, 15, 28, 0.16);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      opacity: 0;
      transform: translateY(35px) scale(0.94);
      transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
      margin: 0 auto;
    }

    .invite-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .video-frame {
      width: 100%;
      background: #000;
      line-height: 0;
      position: relative;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

      width: 100%;
      padding: 34px 20px 28px;
      text-align: center;
      background:

        radial-gradient(circle at bottom left, rgba(110, 19, 34, 0.06), transparent 50%),
        #faf6ef;
      position: relative;
    }
