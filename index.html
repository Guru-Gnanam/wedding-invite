<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gurunathan G & Mariya Epsiba S | Wedding Invite</title>

  <!-- Privacy Tag -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Open Graph Tags -->
  <meta property="og:title" content="Gurunathan & Mariya are getting married!" />
  <meta property="og:description" content="We warmly seek your presence and blessings. Click to view invitation!" />
  <meta property="og:image" content="https://guru-gnanam.github.io/wedding-invite/front-bg.png" />
  <meta property="og:url" content="https://guru-gnanam.github.io/wedding-invite/" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Lightweight Confetti for Flower Shower -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary-wine: #6e1322;
      --deep-crimson: #630f1c;
      --sacred-gold: #b3833b;
      --soft-gold: #d8b26e;
      --card-cream: #faf5ed;
      --text-dark: #2a1f20;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #110507;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--text-dark);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body {
      background: radial-gradient(circle at top, #fdf9f4 0%, #ece0d2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 10px 40px;
    }

    /* Container wrapper for cards */
    .page-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* --- FULL SCREEN OPENING OVERLAY --- */
    #welcomeOverlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: radial-gradient(circle at center, #260a0f 0%, #0d0204 100%);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      margin: 0;
      transition: opacity 0.85s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.85s;
    }

    #welcomeOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope-poster-card {
      width: 100%;
      max-width: 420px;
      height: 94dvh;
      max-height: 720px;
      background: #fdfaf6 url('front-bg.png') no-repeat center center;
      background-size: cover;
      border-radius: 18px;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(198, 146, 59, 0.45);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .seal-tap-zone {
      position: absolute;
      top: 54.5%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .crimson-wax-seal {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle at 35% 35%, #9b1c2e 0%, #761421 65%, #460912 100%);
      border-radius: 50%;
      border: 3px solid #d4af37;
      box-shadow: 
        0 10px 28px rgba(0, 0, 0, 0.5),
        inset 0 2px 6px rgba(255, 255, 255, 0.45),
        0 0 0 4px rgba(212, 175, 55, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: sealPulse 2.5s infinite;
      position: relative;
    }

    .crimson-wax-seal:hover {
      transform: scale(1.08);
    }

    .seal-heart-svg {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      margin-bottom: 2px;
      transition: transform 0.25s ease;
    }

    .seal-text {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 2px;
      color: #faebd7;
      font-weight: 700;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    @keyframes sealPulse {
      0%, 100% { box-shadow: 0 10px 28px rgba(0,0,0,0.5), 0 0 0 4px rgba(212, 175, 55, 0.3); }
      50% { box-shadow: 0 10px 30px rgba(155, 28, 46, 0.7), 0 0 0 10px rgba(212, 175, 55, 0); }
    }

    /* --- COMMON CARD STYLING --- */
    .invite-card, .memories-card {
      max-width: 440px;
      width: 100%;
      background: #faf6ef;
      border: 1px solid #e7d8c6;
      border-radius: 24px;
      box-shadow: 0 22px 55px rgba(99, 15, 28, 0.16);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .invite-card.show, .memories-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .video-frame {
      width: 100%;
      background: #000;
      line-height: 0;
      position: relative;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Content Container */
    .content {
      width: 100%;
      padding: 34px 20px 24px;
      text-align: center;
      background: 
        radial-gradient(circle at top right, rgba(179, 131, 59, 0.08), transparent 50%),
        radial-gradient(circle at bottom left, rgba(110, 19, 34, 0.06), transparent 50%),
        #faf6ef;
      position: relative;
    }

    .content::before {
      content: "";
      position: absolute;
      top: -30px;
      right: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1.5px dashed rgba(179, 131, 59, 0.18);
      box-shadow: 0 0 0 10px rgba(179, 131, 59, 0.05), inset 0 0 0 15px rgba(179, 131, 59, 0.05);
      pointer-events: none;
    }

    .content::after {
      content: "";
      position: absolute;
      bottom: -30px;
      left: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1.5px dashed rgba(179, 131, 59, 0.18);
      box-shadow: 0 0 0 10px rgba(179, 131, 59, 0.05), inset 0 0 0 15px rgba(179, 131, 59, 0.05);
      pointer-events: none;
    }

    .intro-script {
      font-size: 1.25rem;
      font-style: italic;
      color: #634b35;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .flourish-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--sacred-gold);
      font-size: 0.85rem;
      margin: 6px auto 14px;
      width: 60%;
    }

    .flourish-divider::before,
    .flourish-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sacred-gold), transparent);
    }

    .couple-section {
      margin-bottom: 24px;
    }

    .couple-name {
      font-family: 'Alex Brush', cursive;
      font-size: 3.4rem;
      color: var(--primary-wine);
      line-height: 1.05;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .knot-caption {
      font-size: 1.15rem;
      font-style: italic;
      color: #6b533b;
      margin: 4px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .knot-caption span {
      color: var(--sacred-gold);
      font-size: 0.85rem;
    }

    .countdown-arch-banner {
      width: 100%;
      background: radial-gradient(circle at center, #781324 0%, #580d19 100%);
      border: 1.5px solid var(--sacred-gold);
      border-radius: 40px;
      padding: 14px 12px 12px;
      box-shadow: 0 8px 24px rgba(99, 15, 28, 0.28), inset 0 1px 3px rgba(255, 255, 255, 0.25);
      margin-bottom: 30px;
      position: relative;
    }

    .countdown-title {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 3.5px;
      color: var(--soft-gold);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 10px;
      text-align: center;
    }

    .countdown-columns {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 14px;
    }

    .count-unit-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .count-val {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.9rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1;
    }

    .count-lbl {
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      letter-spacing: 2px;
      color: #dfcaa7;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .count-divider-line {
      width: 1px;
      height: 32px;
      background: rgba(216, 178, 110, 0.35);
    }

    .arch-corner-star {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--soft-gold);
      font-size: 0.95rem;
    }
    .star-left { left: 14px; }
    .star-right { right: 14px; }

    .ceremony-block {
      margin-bottom: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gold-emblem-svg {
      width: 76px;
      height: 38px;
      margin-bottom: 4px;
      filter: drop-shadow(0 2px 4px rgba(179, 131, 59, 0.25));
    }

    .ceremony-title {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary-wine);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .ceremony-date {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 3px;
    }

    .ceremony-venue {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.88rem;
      color: #55433a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-bottom: 12px;
    }

    .btn-maroon-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: radial-gradient(circle at 30% 30%, #891a2b 0%, #600c19 100%);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.84rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      padding: 9px 26px;
      border-radius: 30px;
      border: 1.5px solid var(--soft-gold);
      box-shadow: 0 4px 14px rgba(99, 15, 28, 0.35);
      transition: all 0.25s ease;
    }

    .btn-maroon-pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(99, 15, 28, 0.45);
      filter: brightness(1.08);
    }

    .footer-blessing-text {
      font-size: 1.2rem;
      font-style: italic;
      color: #6d523a;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    /* --- INLINE SCROLL DOWN INDICATOR --- */
    .scroll-indicator-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin-top: 26px;
      text-decoration: none;
      color: var(--sacred-gold);
      cursor: pointer;
      animation: floatBlink 2.2s ease-in-out infinite;
    }

    .scroll-text {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      letter-spacing: 2.5px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--primary-wine);
      margin-bottom: 6px;
    }

    .scroll-mouse-pill {
      width: 22px;
      height: 36px;
      border: 2px solid var(--sacred-gold);
      border-radius: 14px;
      display: flex;
      justify-content: center;
      padding-top: 6px;
      box-shadow: 0 2px 8px rgba(179, 131, 59, 0.25);
    }

    .scroll-dot {
      width: 4px;
      height: 7px;
      background: var(--primary-wine);
      border-radius: 2px;
      animation: dotDrop 1.8s infinite;
    }

    .scroll-arrow-chevrons {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 4px;
      line-height: 0.7;
      font-size: 0.75rem;
    }

    @keyframes floatBlink {
      0%, 100% { transform: translateY(0); opacity: 0.85; }
      50% { transform: translateY(6px); opacity: 1; }
    }

    @keyframes dotDrop {
      0% { transform: translateY(0); opacity: 1; }
      80% { transform: translateY(12px); opacity: 0; }
      100% { transform: translateY(0); opacity: 0; }
    }

    /* --- FLOATING TRANSPARENT SCROLL POP-UP INDICATOR --- */
    .floating-scroll-pill {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(38, 10, 15, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(216, 178, 110, 0.7);
      padding: 9px 20px;
      border-radius: 30px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      text-decoration: none;
      color: #faebd7;
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 1.8px;
      font-weight: 600;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s ease;
      animation: floatPop 2.5s ease-in-out infinite;
    }

    .floating-scroll-pill.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .floating-scroll-arrow {
      color: var(--soft-gold);
      font-size: 0.95rem;
      animation: arrowBounce 1.4s infinite;
      line-height: 1;
    }

    @keyframes floatPop {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -6px); }
    }

    @keyframes arrowBounce {
      0%,
