  <style>
    :root {
      --primary-wine: #6e1322;
      --deep-crimson: #630f1c;
      --sacred-gold: #b3833b;
      --soft-gold: #d8b26e;
      --card-cream: #faf5ed;
      --text-dark: #2a1f20;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--text-dark);
      background-color: #110507;
    }

    body {
      background: radial-gradient(circle at top, #fdf9f4 0%, #ece0d2 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 12px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- FLOATING MUSIC DISC (TOP RIGHT) --- */
    .music-disc-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(42, 10, 16, 0.88);
      border: 1.5px solid var(--sacred-gold);
      border-radius: 30px;
      padding: 6px 14px 6px 8px;
      color: #fff4db;
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .music-disc-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    }

    .vinyl-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #d4af37 0%, #3a2205 35%, #111111 40%, #111111 75%, #d4af37 100%);
      box-shadow: 0 0 6px rgba(212, 175, 55, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .vinyl-center-dot {
      width: 6px;
      height: 6px;
      background: #faf6ef;
      border-radius: 50%;
    }

    .music-disc-btn.playing .vinyl-icon {
      animation: spinVinyl 3.5s linear infinite;
    }

    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Animated equalizer bars */
    .sound-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .sound-bar {
      width: 2px;
      background: var(--soft-gold);
      border-radius: 1px;
      height: 3px;
      transition: height 0.2s ease;
    }

    .music-disc-btn.playing .sound-bar:nth-child(1) { animation: soundBarWave 1.1s ease-in-out infinite; }
    .music-disc-btn.playing .sound-bar:nth-child(2) { animation: soundBarWave 0.8s ease-in-out 0.2s infinite; }
    .music-disc-btn.playing .sound-bar:nth-child(3) { animation: soundBarWave 1.3s ease-in-out 0.4s infinite; }

    @keyframes soundBarWave {
      0%, 100% { height: 3px; }
      50% { height: 12px; }
    }

    /* --- INVITATION MAIN CARD --- */
    .invite-card {
      max-width: 440px;
      width: 100%;
      background: #faf6ef;
      border: 1px solid #e7d8c6;
      border-radius: 24px;
      box-shadow: 0 22px 55px rgba(99, 15, 28, 0.16);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      margin: 0 auto;
    }

    .video-frame {
      width: 100%;
      background: #000;
      line-height: 0;
      position: relative;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .content {
      width: 100%;
      padding: 34px 20px 28px;
      text-align: center;
      background: 
        radial-gradient(circle at top right, rgba(179, 131, 59, 0.08), transparent 50%),
        radial-gradient(circle at bottom left, rgba(110, 19, 34, 0.06), transparent 50%),
        #faf6ef;
      position: relative;
    }

    .content::before {
      content: "";
      position: absolute;
      top: -30px;
      right: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1.5px dashed rgba(179, 131, 59, 0.18);
      box-shadow: 0 0 0 10px rgba(179, 131, 59, 0.05), inset 0 0 0 15px rgba(179, 131, 59, 0.05);
      pointer-events: none;
    }

    .content::after {
      content: "";
      position: absolute;
      bottom: -30px;
      left: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1.5px dashed rgba(179, 131, 59, 0.18);
      box-shadow: 0 0 0 10px rgba(179, 131, 59, 0.05), inset 0 0 0 15px rgba(179, 131, 59, 0.05);
      pointer-events: none;
    }

    .intro-script {
      font-size: 1.25rem;
      font-style: italic;
      color: #634b35;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .flourish-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--sacred-gold);
      font-size: 0.85rem;
      margin: 6px auto 14px;
      width: 60%;
    }

    .flourish-divider::before,
    .flourish-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sacred-gold), transparent);
    }

    .couple-section {
      margin-bottom: 24px;
    }

    .couple-name {
      font-family: 'Alex Brush', cursive;
      font-size: 3.4rem;
      color: var(--primary-wine);
      line-height: 1.05;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
