<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation | Gurunathan & Mariya Epsiba</title>
  <style>
    :root {
      --primary: #8b2635;
      --bg: #faf7f2;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      padding-bottom: 24px;
      text-align: center;
    }
    video {
      width: 100%;
      display: block;
      background: #000;
    }
    .info {
      padding: 20px 16px 0;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .sub {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .event {
      background: var(--bg);
      border: 1px solid #ebdcd0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .event h2 {
      font-size: 1.05rem;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .date {
      font-weight: 600;
      color: #333;
      margin-bottom: 2px;
    }
    .venue {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 10px;
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      background: var(--primary);
      color: #fff;
      font-size: 0.85rem;
      padding: 7px 16px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <video controls playsinline preload="metadata">
      <source src="invite.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
    <div class="info">
      <h1>Gurunathan & Mariya Epsiba</h1>
      <p class="sub">Together with our families, we joyfully invite you</p>
      
      <div class="event">
        <h2>Wedding Celebration</h2>
        <div class="date">20th November 2026</div>
        <div class="venue">MJR Mahal, Marakkanam</div>
        <a href="https://maps.google.com/?q=MJR+Mahal+Marakkanam" target="_blank" rel="noopener" class="btn">View Location</a>
      </div>

      <div class="event">
        <h2>Reception Celebration</h2>
        <div class="date">25th November 2026</div>
        <div class="venue">Om Thirumana Mandapam</div>
        <a href="https://maps.google.com/?q=Om+Thirumana+Mandapam" target="_blank" rel="noopener" class="btn">View Location</a>
      </div>
    </div>
  </div>
</body>
</html>
